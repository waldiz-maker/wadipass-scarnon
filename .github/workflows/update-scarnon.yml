name: Update SCARNON data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Generate SCARNON data
        env:
          WADIPASS_NAVER_CLIENT_ID: ${{ secrets.WADIPASS_NAVER_CLIENT_ID }}
          WADIPASS_NAVER_CLIENT_SECRET: ${{ secrets.WADIPASS_NAVER_CLIENT_SECRET }}
          WADIPASS_GOOGLE_SHEET_URL: ${{ vars.WADIPASS_GOOGLE_SHEET_URL }}
        run: |
          python generate_scarnon.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Update SCARNON data"
          git push
