name: Update SCARNON data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        run: pip install -r python/requirements.txt

      - name: Build SCARNON data
        env:
          WADIPASS_GOOGLE_SHEET_URL: ${{ vars.WADIPASS_GOOGLE_SHEET_URL }}
          WADIPASS_NAVER_CLIENT_ID: ${{ secrets.WADIPASS_NAVER_CLIENT_ID }}
          WADIPASS_NAVER_CLIENT_SECRET: ${{ secrets.WADIPASS_NAVER_CLIENT_SECRET }}
        run: python python/build_data.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet && exit 0
          git commit -m "Update SCARNON data"
          git push
